name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calsite
          POSTGRES_PASSWORD: calsite
          POSTGRES_DB: calsite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calsite -d calsite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://calsite:calsite@localhost:5432/calsite
      TEST_DATABASE_URL: postgresql://calsite:calsite@localhost:5432/calsite
      AUTH_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
