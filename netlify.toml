# CalSite Safety is a Next.js App Router app. Netlify detects Next.js and
# configures the runtime. The database is external Postgres (DATABASE_URL).
# Run `npx prisma migrate deploy` against that database before promoting a release.
# Do not run the demonstration seed against production.

[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"

# The service worker and manifest are static files. Do not give sw.js a long cache:
# a cached worker keeps the previous fetch policy after a deploy.
[[headers]]
for = "/sw.js"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"
Cache-Control = "no-cache, no-store, must-revalidate"
Service-Worker-Allowed = "/"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/offline.html"
[headers.values]
Content-Type = "text/html; charset=utf-8"
Cache-Control = "no-cache, no-store, must-revalidate"
X-Content-Type-Options = "nosniff"
